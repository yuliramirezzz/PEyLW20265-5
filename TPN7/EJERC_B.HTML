<html>
    <head>
        <style>
            .top,.izq,.central,.pie{
                background-color: darkgray;
                border: 1px solid black;
                width: 300px;
                height: 150px;
                margin: 13px;
            }
            .top{
                width: 100%;
                height: 70px;
            }
            .contenedor{
                display: flex;
            }
            .izq{width: 200px;
                height: 500px;
            }
            .central{width: 1100px;
                height: 500px;
            }
            .pie{
                width: 100%;
                height: 70px;
            }
        </style>
    </head>
    <body>
        <div class="top">top</div>
        <div class="contenedor">
            <div class="izq">izq</div>
            <div class="central">central</div>
        </div>
        <div class="pie">pie</div>
    </body>
</html>
